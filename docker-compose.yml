version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: skillmesh_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skillmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  redis:
    image: redis:alpine
    container_name: skillmesh_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
